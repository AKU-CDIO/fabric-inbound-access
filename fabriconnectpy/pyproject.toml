[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricpy"
version = "0.1.0"
description = "Read Microsoft Fabric Lakehouse tables via OneLake HTTPS API"
requires-python = ">=3.10"
dependencies = [
    "deltalake",
]

[project.optional-dependencies]
pandas = ["pandas"]
